Parameters:
  LMCompanyName:
    Type: String
    Default: ""
    Description: The LogicMonitor acccount name.
  LMAccessId:
    Type: String
    NoEcho: true
    Default: ""
    Description: The LogicMonitor API tokens access ID
  LMAccessKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: The LogicMonitor API tokens access key
  LMBearerToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: The LogicMonitor API Bearer token. (You must specify LMBearerToken if not providing LMAccessId, LMAccessKey. In case you provide all, LMAccessId and LMAccessKey will be used to authenticate with Logicmonitor.  )
  Metadata:
    Type: CommaDelimitedList
    Description: Metadata if any
    Default: awsRegion, arn
    AllowedValues:
      - awsRegion
      - arn
  MetadataKeysForJsonLogs:
    Type: CommaDelimitedList
    Description: Json keys to include in event metadata for cloudtaril logs and cloudwatch logs of json type
    Default: ""
  LMTenantIdentifier:
    Type: String
    Description: LogicMonitor Tenant Identifier send in the metadata with logs to LogicMonitor portal
    Default: ""
  UseSecretManagerForStoringSecrets:
    Type: String
    Description: If true it will use secrets manager and cache the credentials which can incur cost to secrets manager.If false it will use enviromental variables
    AllowedValues: [true, false]
    Default: "false"
  FunctionName:
    Type: String
    Default: LMLogsForwarder
    Description: The name for the LM Forwarder lambda function.
  LMRegexScrub:
    Type: String
    Default: ""
    Description: Regex to scrub text from logs.
  FunctionMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
    MaxValue: 3008
    Description:  The memory size for the LM Forwarder lambda function
  FunctionTimeoutInSeconds:
    Type: Number
    Default: 360
    Description: The timeout for the LM Forwarder lambda function
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: ARN for the Permissions Boundary Policy
  AccountLevelSubscription:
    Type: String
    AllowedValues: [true, false]
    Default: "false"
    Description: If true it will enable account level subscription to forward logs to the LMLogsForwarder lambda.
  FilterPattern:
    Type: String
    Description: Specify the log event structure and any filter conditions to apply on your log data as it gets streamed to LMLogsForwarder lambda. Only applicable if AccountLevelSubscription is true.
    Default: ""
  SelectionCriteria:
    Type: String
    Description: Use this parameter to apply a subscription filter policy to a subset of log groups in the account. The string can be up to 25KB in length. Example LogGroupName NOT IN ["MyLogGroup", "MyAnotherLogGroup"]
    Default: ""
  ResourceType:
    Type: String
    Description: Type of platform from where logs are coming.
    Default: "AWS"

Rules:
  NoAccessIdKeyProvided:
    RuleCondition: !Or [!Equals [!Ref LMAccessId, ""], !Equals [!Ref LMAccessKey, ""]]
    Assertions:
      - AssertDescription: Please specify either LMAccessId, LMAccessKey both or LMBearerToken to authenticate with Logicmonitor.
        Assert: !Not
          - !Equals
            - !Ref LMBearerToken
            - ""

Resources:
  Forwarder:
    Type: AWS::Serverless::Function
    DependsOn: ForwarderZip
    Properties:
      FunctionName:
        Ref: FunctionName
      Description: Pushes aws logs to Logic Monitor log endpoint.
      Handler: bootstrap
      MemorySize:
        Ref: FunctionMemorySize
      Runtime: provided.al2
      CodeUri:
        Bucket: !Ref ForwarderZipsBucket
        Key: main.zip
      Timeout:
        Ref: FunctionTimeoutInSeconds
      Layers:
        - Fn::If:
            - CreateSecretManager
            - !FindInMap [RegionToLayerArnMap, !Ref "AWS::Region", LayerArn]
            - Ref: AWS::NoValue
      Environment:
        Variables:
          LM_ACCOUNT:
            Ref: LMCompanyName
          METADATA: !Join [",", !Ref Metadata]
          LOGICMONITOR_ACCESS_ID: !If [UseLMV1ForAuth, !If [CreateSecretManager, !Ref AccessIdSecret, !Ref LMAccessId],  ""] #!Ref AccessIdSecret, !If [UseLMV1ForAuth, !Ref LMAccessId, "" ]
          LOGICMONITOR_ACCESS_KEY: !If [UseLMV1ForAuth, !If [CreateSecretManager, !Ref AccessKeySecret, !Ref LMAccessKey],  ""]
          LOGICMONITOR_BEARER_TOKEN: !If [MustUseBearerTokenForAuth, !If [CreateSecretManager, !Ref BearerTokenSecret, !Ref LMBearerToken],  ""]
          LM_SCRUB_REGEX:
            Ref: LMRegexScrub
          USE_SECRET_MANAGER:
            Ref: UseSecretManagerForStoringSecrets
          JSON_METADATA_KEYS: !Join [",", !Ref MetadataKeysForJsonLogs]
          ADD_CLOUDWATCH_METADATA: "true"
          LM_TENANT_IDENTIFIER:
            Ref: LMTenantIdentifier
          RESOURCE_TYPE:
            Ref: ResourceType
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:Get*
              Resource: "*"
            - Fn::If:
                - CreateSecretManager
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource:
                    - !If [UseLMV1ForAuth, !Ref AccessIdSecret, !Ref AWS::NoValue]
                    - !If [UseLMV1ForAuth, !Ref AccessKeySecret, !Ref AWS::NoValue]
                    - !If [MustUseBearerTokenForAuth, !Ref BearerTokenSecret, !Ref AWS::NoValue]
                - Ref: AWS::NoValue
  CloudWatchLogsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref "Forwarder"
      Action: lambda:InvokeFunction
      Principal: !Sub "logs.${AWS::Region}.amazonaws.com"
      SourceAccount: !Ref "AWS::AccountId"
  S3Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref "Forwarder"
      Action: lambda:InvokeFunction
      Principal: "s3.amazonaws.com"
      SourceAccount: !Ref "AWS::AccountId"
  ForwarderZipsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ForwarderZip:
    Type: Custom::ForwarderZip
    Properties:
      ServiceToken: !GetAtt "ForwarderZipCopier.Arn"
      DestZipsBucket: !Ref "ForwarderZipsBucket"
      SourceZipUrl:
        Fn::Sub:
          - "https://logicmonitor-logs-forwarder.s3.amazonaws.com/source/code/${LMForwarderVersion}/lambda.zip"
          - {
            LMForwarderVersion:
              !FindInMap [Constants, LMForwarder, Version],
          }
  ForwarderZipCopier:
    Type: AWS::Serverless::Function
    Properties:
      Description: Copies Logic Monitor Forwarder zip to the destination S3 bucket
      Handler: index.handler
      Runtime: python3.11
      Timeout: 300
      InlineCode: |
        import json
        import logging
        import threading
        import boto3
        import urllib.request
        import os

        logger = logging.getLogger()
        logger.setLevel(logging.INFO)

        def send_cfn_resp(event, context, response_status):
            resp_body = json.dumps({
                'Status': response_status,
                'Reason': f'See reasons in CloudWatch Logs - group: {context.log_group_name}, stream:{context.log_stream_name}',
                'PhysicalResourceId': context.log_stream_name,
                'StackId': event['StackId'],
                'RequestId': event['RequestId'],
                'LogicalResourceId': event['LogicalResourceId'],
                'Data': {}
            }).encode('utf-8')
            req = urllib.request.Request(url=event['ResponseURL'], data=resp_body, method='PUT')
            with urllib.request.urlopen(req) as f:
                logger.info(f'Sent response to CloudFormation: {f.status}, {f.reason}')
        def delete_zips(bucket):
            s3 = boto3.resource('s3')
            bucket = s3.Bucket(bucket)
            bucket.objects.all().delete()
        def copy_zip(source_zip_url, dest_zips_bucket):
            s3 = boto3.client('s3')
            filename = "main.zip"
            with urllib.request.urlopen(source_zip_url) as data:
                s3.upload_fileobj(data, dest_zips_bucket, filename, ExtraArgs={'ServerSideEncryption':'AES256'})
        def timeout(event, context):
            logger.error('Execution is about to time out, sending failure response to CloudFormation')
            send_cfn_resp(event, context, 'FAILED')
        def handler(event, context):
            timer = threading.Timer((context.get_remaining_time_in_millis()
                        / 1000.00) - 0.5, timeout, args=[event, context])
            timer.start()
            logger.info(f'Received event: {json.dumps(event)}')
            try:
                source_zip_url = event['ResourceProperties']['SourceZipUrl']
                dest_zips_bucket = event['ResourceProperties']['DestZipsBucket']
                if event['RequestType'] == 'Delete':
                    logger.info(f'Deleting : {dest_zips_bucket}')
                    delete_zips(dest_zips_bucket)
                else:
                    logger.info(f'Copying zip from : {source_zip_url} to {dest_zips_bucket}')
                    copy_zip(source_zip_url, dest_zips_bucket)
            except Exception as e:
                logger.exception(f'Exception when copying zip from {source_zip_url} to {dest_zips_bucket}')
                send_cfn_resp(event, context, 'FAILED')
            else:
                send_cfn_resp(event, context, 'SUCCESS')
            finally:
                timer.cancel()
      PermissionsBoundary:
        Fn::If:
          - SetPermissionsBoundary
          - Ref: PermissionsBoundaryArn
          - Ref: AWS::NoValue
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - Fn::Join:
                    - "/"
                    - - Fn::GetAtt: "ForwarderZipsBucket.Arn"
                      - "*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - Fn::GetAtt: "ForwarderZipsBucket.Arn"
      Environment:
        Variables:
          LM_FORWARDER_VERSION: !FindInMap [Constants, LMForwarder, Version]
  AccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecretAccess
    Properties:
      Description: LogicMonitor Access Key
      SecretString:
        Ref: LMAccessKey
  AccessIdSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecretAccess
    Properties:
      Description: LogicMonitor Access Id
      SecretString:
        Ref: LMAccessId
  BearerTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateSecretBearerToken
    Properties:
      Description: LogicMonitor Bearer Token
      SecretString:
        Ref: LMBearerToken
  AccountPolicy:
    Condition: IsAccountLevel
    Type: AWS::Logs::AccountPolicy
    DependsOn: [Forwarder, CloudWatchLogsPermission, S3Permission]
    Properties:
      PolicyName: account-subscriptionfilter-policy
      PolicyDocument: !Sub "{\"DestinationArn\":\"arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}\", \"FilterPattern\": \"${FilterPattern}\"}"
      PolicyType: "SUBSCRIPTION_FILTER_POLICY"
      Scope: "ALL"
      SelectionCriteria:
        Fn::If:
          - HasSelectionCriteria
          - Ref: SelectionCriteria
          - Ref: AWS::NoValue
Conditions:
  SetPermissionsBoundary:
    Fn::Not:
      - Fn::Equals:
          - Ref: PermissionsBoundaryArn
          - ""
  AccessIdEmpty: !Equals [!Ref LMAccessId, ""]
  AccessKeyEmpty: !Equals [!Ref LMAccessKey, ""]
  MustUseBearerTokenForAuth: !Or
    - !Condition AccessIdEmpty
    - !Condition AccessKeyEmpty
  UseLMV1ForAuth: !Not [!Condition MustUseBearerTokenForAuth]
  CreateSecretManager: !Equals [!Ref UseSecretManagerForStoringSecrets, true]
  CreateSecretAccess: !And
    - !Condition UseLMV1ForAuth
    - !Condition CreateSecretManager
  CreateSecretBearerToken: !And
    - !Condition MustUseBearerTokenForAuth
    - !Condition CreateSecretManager
  IsAccountLevel: !Equals [!Ref AccountLevelSubscription, 'true']
  HasSelectionCriteria:  !Not [!Equals [!Ref SelectionCriteria, ""]]
Outputs:
  LMForwarderArn:
    Description: LogicMonitor Forwarder Lambda Function ARN
    Value:
      Fn::GetAtt:
        - Forwarder
        - Arn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-ForwarderArn
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - FunctionName
          - LMCompanyName
          - LMAccessId
          - LMAccessKey
          - LMBearerToken
          - LMRegexScrub
          - UseSecretManagerForStoringSecrets
      - Label:
          default: Lambda Function (Optional)
        Parameters:
          - Metadata
          - MetadataKeysForJsonLogs
          - LMTenantIdentifier
          - FunctionMemorySize
          - FunctionTimeoutInSeconds
          - AccountLevelSubscription
          - FilterPattern
          - SelectionCriteria
          - ResourceType
          
